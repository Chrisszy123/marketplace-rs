##
## Production stack for a single-VPS deployment. Meilisearch, MinIO, the app, and the reverse
## proxy run as containers on one Docker network; only Caddy publishes ports to the host.
## Postgres and Redis are external managed services (e.g. Supabase, Upstash) — see DATABASE_URL
## and REDIS_URL in .env.example.
##
## Usage: docker compose -f docker-compose.prod.yml up -d --build
## Requires a `.env` file next to this one — see .env.example.
##
services:
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
      SERVER_ADDR: 0.0.0.0:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ALLOWED_ORIGIN: https://${DOMAIN}
      COOKIE_SECURE: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: marketplace-listings
      S3_REGION: us-east-1
      S3_PUBLIC_URL_BASE: https://media.${DOMAIN}/marketplace-listings
      RUST_LOG: marketplace_backend=info,tower_http=info
    depends_on:
      meilisearch: { condition: service_healthy }
      minio: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.${DOMAIN}
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - minio

volumes:
  meilisearch_data:
  minio_data:
  caddy_data:
  caddy_config:
